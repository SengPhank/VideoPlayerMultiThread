spring.application.name=SubtitleServer
server.shutdown=graceful
# Java 25: one cheap virtual thread per blocking request (Whisper calls are slow I/O)
spring.threads.virtual.enabled=true
# Whisper-1 rejects uploads over 25 MB
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
# Key comes from env
openai.api.key=${OPENAI_API_KEY:}